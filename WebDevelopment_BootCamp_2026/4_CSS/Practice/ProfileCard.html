<!DOCTYPE html>
<html lang="en">
    <head>
      <meta charset="UTF-8">
      <link rel="stylesheet" href="ProfileCard.css">
      <title>Profile Card</title>
    </head>

    <body>
        <header>
            <img src="goldenRetriever_copy.jpg">
            <h1>Golden Retriever</h1>
            <h2>Canis lupus familiaris</h2>
        </header>

        <main>
            <button id="family_button">Family</button>
            <button id="breed_button">Large breed</button>

            <table>
                <tr>
                    <td class="title">Avg weight</td>
                    <td>25-34 Kg</td>
                </tr>

                <tr>
                    <td class="title">Lifespan</td>
                    <td>10-12 years</td>
                </tr>

                <tr>
                    <td class="title">Origin</td>
                    <td>Scotland, 1800s</td>
                </tr>

                <tr>
                    <td class="title">Temperament</td>
                    <td>Friendly, gentle, loyal.</td>
                </tr>
            </table>
        </main>

        <footer>
          <p>"Great with families and children."</p>
        </footer>
    </body>
</html>
